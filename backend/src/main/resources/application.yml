server:
  port: ${PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 8KB
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: lautaro-portfolio-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS_ENABLED:true}
      "[mail.smtp.starttls.required]": ${MAIL_STARTTLS_REQUIRED:true}
      "[mail.smtp.connectiontimeout]": 4000
      "[mail.smtp.timeout]": 4000
      "[mail.smtp.writetimeout]": 4000

portfolio:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  contact:
    mail-enabled: ${CONTACT_MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
    to: ${CONTACT_TO:busonlautaro@gmail.com}
